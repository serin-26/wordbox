<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>단어 상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=block">
<style>
/* Layout: a single narrow column. Index cards (red header rule, blue ruled lines) carry the study; Leitner drawers show progress. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1B261F; --muted:#586459; --line:#D5DCD3;
  --accent:#3F7355; --accent-ink:#FFFFFF; --accent-soft:#E0EBE2;
  --hl:#FFE56A; --hl-ink:#1B261F;
  --card:#FFFFFF; --rule-red:#EE8A92; --rule-blue:#DCE8DD;
  --good:#17724A; --good-bg:#DDF3E7; --warn:#80530A; --warn-bg:#FBEED2; --bad:#A6313F; --bad-bg:#FBE3E6;
  --shadow:0 1px 0 rgba(27,38,31,.05),0 10px 26px -14px rgba(27,38,31,.3);
  --f-display:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
  --f-body:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
  --f-mono:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18221C; --ink:#E6EEE7; --muted:#9DAEA1; --line:#2B3A30;
    --accent:#8CBF9F; --accent-ink:#0F1612; --accent-soft:#25382B;
    --hl:#5E5314; --hl-ink:#FFF0A0;
    --card:#1C2820; --rule-red:#8E4A55; --rule-blue:#2C3F32;
    --good:#74D8A6; --good-bg:#163B2C; --warn:#F2C56E; --warn-bg:#3C2E12; --bad:#FF9CA8; --bad-bg:#40202B;
    --shadow:0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --ink:#E6EEE7; --muted:#9DAEA1; --line:#2B3A30;
  --accent:#8CBF9F; --accent-ink:#0F1612; --accent-soft:#25382B;
  --hl:#5E5314; --hl-ink:#FFF0A0;
  --card:#1C2820; --rule-red:#8E4A55; --rule-blue:#2C3F32;
  --good:#74D8A6; --good-bg:#163B2C; --warn:#F2C56E; --warn-bg:#3C2E12; --bad:#FF9CA8; --bad-bg:#40202B;
  --shadow:0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-synthesis:none;
  font-variant-numeric:tabular-nums;
  background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:42rem;margin-inline:auto;display:grid;gap:18px;min-width:0}
.wrap>*{min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;margin:0;font:700 1.5rem/1.2 var(--f-display);letter-spacing:-.01em}
.brand svg{color:var(--accent);flex:none}
.status{display:flex;align-items:center;gap:.45rem;font:400 .75rem/1.3 var(--f-mono);color:var(--muted)}
.status i{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted);flex:none}
.status.ok i{background:var(--good)}
.status.busy i{background:var(--warn)}
.status.warn i{background:var(--warn)}
.status.bad i{background:var(--bad)}
.status button{border:0;background:none;padding:0;font:inherit;color:var(--bad);text-decoration:underline}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{min-height:2.75rem;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.4rem .25rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{font:700 .75rem/1 var(--f-mono);padding:.2rem .4rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tab[aria-selected="true"] .badge{background:var(--accent-ink);color:var(--accent)}

.panel{display:grid;gap:16px;align-content:start}
.panel>*{min-width:0}

/* generic */
.eyebrow{margin:0;font:700 .75rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:2.75rem;padding:0 1.1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:2.25rem;padding:0 .8rem;font-size:.875rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:2.25rem;padding:0 .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.875rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.note{color:var(--muted);font-size:.9375rem;margin:0}
.msg{margin:0;font-size:.9375rem;min-height:1.4em}
.msg.ok{color:var(--good)}
.msg.bad{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 .8125rem/1.3 var(--f-mono);color:var(--muted)}

/* review home */
.hero{display:grid;gap:.5rem}
.big{margin:0;font:700 1.75rem/1.25 var(--f-body);text-wrap:balance}
.num{font:700 2.25rem/1 var(--f-display);padding:0 .1em;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.sub{margin:0;color:var(--muted)}
.hero .btns{margin-top:.5rem}
.drawers{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end}
.drawer{display:grid;grid-template-rows:auto 4.5rem auto;justify-items:center;gap:4px;min-width:0}
.drawer .n{font:700 .8125rem/1 var(--f-mono)}
.drawer .col{align-self:stretch;display:flex;align-items:flex-end}
.drawer .bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.drawer.zero .n{color:var(--muted)}
.drawer .l{font:400 .6875rem/1.2 var(--f-mono);color:var(--muted);white-space:nowrap}
.onboard pre{margin:.5rem 0 0;padding:.75rem;border-radius:8px;background:var(--bg);font:400 .8125rem/1.6 var(--f-mono);overflow-x:auto;white-space:pre}

/* index card */
.cardwrap{position:relative}
.card{
  display:grid;grid-template-rows:3.1rem 1fr;min-height:18rem;border:1px solid var(--line);border-radius:8px;
  background-color:var(--card);
  background-image:linear-gradient(var(--rule-red),var(--rule-red)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2rem - 1px),var(--rule-blue) calc(2rem - 1px),var(--rule-blue) 2rem);
  background-size:100% 2px,100% calc(100% - 3.1rem);
  background-position:0 calc(3.1rem - 2px),0 3.1rem;
  background-repeat:no-repeat;
  box-shadow:var(--shadow);cursor:pointer;-webkit-user-select:none;user-select:none;
}
.card-head{display:flex;align-items:center;padding:0 3.2rem 0 1.1rem;font:400 .75rem/1.3 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.card-body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;padding:1rem 1.25rem 1.25rem;min-width:0}
.headword{font:700 clamp(2.2rem,9vw,3.1rem)/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere;padding:0 .12em;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.headword.sm{font-size:clamp(1.7rem,7vw,2.2rem)}
.meaning-big{font:700 clamp(1.6rem,6.5vw,2.1rem)/1.3 var(--f-body);overflow-wrap:anywhere}
.meaning{font:700 1.5rem/1.35 var(--f-body);overflow-wrap:anywhere}
.answer{min-height:6.5rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5rem;max-width:100%}
.answer.on{animation:rise .22s ease-out}
.hint{color:var(--muted);font-size:.9375rem;margin:0}
.ex{margin:0;color:var(--muted);font:400 1.0625rem/1.5 var(--f-body);overflow-wrap:anywhere}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:2px}
.speak{position:absolute;top:.3rem;right:.4rem;width:2.5rem;height:2.5rem;border-radius:999px;border:0;background:transparent;color:var(--accent);display:grid;place-items:center}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{min-height:3.75rem;border-radius:8px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);display:grid;place-items:center;align-content:center;gap:.15rem;padding:.4rem;font-weight:700;line-height:1.2}
.gbtn small{font:400 .75rem/1.2 var(--f-mono)}
.gbtn.again{background:var(--bad-bg);color:var(--bad)}
.gbtn.hard{background:var(--warn-bg);color:var(--warn)}
.gbtn.good{background:var(--good-bg);color:var(--good)}
.reveal{width:100%;min-height:3.75rem}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:.75rem;background:var(--surface);text-align:center}
.stat b{display:block;font:700 1.5rem/1.2 var(--f-display)}
.stat span{font-size:.8125rem;color:var(--muted)}

/* quiz */
.options{display:grid;gap:8px}
.opt{min-height:3.25rem;text-align:left;padding:.6rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;overflow-wrap:anywhere}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.modes{display:grid;gap:8px}
.mode{text-align:left;padding:.75rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;gap:.1rem}
.mode b{font-weight:700}
.mode span{font-size:.875rem;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.fb{margin:0;font-weight:700}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.pattern{font:700 1.125rem/1.4 var(--f-mono);letter-spacing:.15em;color:var(--muted)}
.wronglist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.wronglist li{display:flex;justify-content:space-between;gap:12px;padding:.6rem 0;border-top:1px solid var(--line)}
.wronglist b{font-family:var(--f-display);font-size:1.0625rem}
.wronglist span{color:var(--muted);text-align:right;overflow-wrap:anywhere}

/* words */
label.f{display:grid;gap:.3rem;font-size:.8125rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=search],textarea{width:100%;min-height:2.75rem;padding:.5rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:7.5rem;font:400 .875rem/1.6 var(--f-body);resize:vertical}
input[type=file]{max-width:100%;font-size:.875rem}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.box>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";font:400 1.25rem/1 var(--f-mono);color:var(--muted)}
details.box[open]>summary::after{content:"\2212"}
details.box .inner{display:grid;gap:12px;margin-top:.9rem}
.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.item{display:grid;gap:.5rem;padding:.8rem 0;border-top:1px solid var(--line)}
.item .main{display:grid;gap:.15rem;min-width:0}
.item .en{font:700 1.1875rem/1.3 var(--f-display);overflow-wrap:anywhere}
.item .ko{overflow-wrap:anywhere}
.item .exs{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.item .line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font:700 .75rem/1 var(--f-mono);padding:.3rem .5rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.new{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--good-bg);color:var(--good)}

.bars{display:flex;gap:12px;flex-wrap:wrap}
.bars .scopebar{flex:1 1 11rem;min-width:0}
.scopebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scopebar select{flex:1;min-width:0;max-width:18rem;min-height:2.75rem}
select{max-width:100%;min-height:2.25rem;padding:.3rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
@media (max-width:420px){
  .form .two{grid-template-columns:1fr}
  .tab{font-size:.875rem}
}
@media (prefers-reduced-motion:reduce){
  .answer.on{animation:none}
  .meter span{transition:none}
}
</style>
</head>

async function flush(){
  clearTimeout(timer);
  if(saving){again=true;return;}
  lsWrite();
  if(!base){dirty.clear();S.saveState='local';renderStatus();return;}
  if(!dirty.size){S.saveState='saved';renderStatus();return;}
  saving=true;S.saveState='saving';renderStatus();
  try{
    var list=Array.from(dirty);
    for(var k=0;k<list.length;k++){
      var c=list[k];
      if(c==='meta'){await base.doc('meta').set({folders:S.folders.slice(),langs:S.langs.slice()});dirty.delete(c);continue;}
      var words=S.words.filter(function(w){return chunkOf(w)===c;});
      await base.doc('c'+c).set({words:words});
      dirty.delete(c);
    }
    S.saveState='saved';
  }catch(e){S.saveState='error';}
  saving=false;renderStatus();

  again=false;
}

  rows.forEach(function(r){

/* ---------- CSV ---------- */
function parseTable(text){
  text=String(text).replace(/^\uFEFF/,'');
  var lines=text.split(/\r?\n/);
  var first='';for(var i=0;i<lines.length;i++){if(lines[i].trim()){first=lines[i];break;}}
  var delim=first.indexOf('\t')>=0?'\t':',';
  var rows=[],row=[],cell='',q=false;
  for(var j=0;j<text.length;j++){
    var c=text[j];
    if(q){
      if(c==='"'){if(text[j+1]==='"'){cell+='"';j++;}else q=false;}
      else cell+=c;
    }else if(c==='"'&&cell===''){q=true;}
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[j+1]==='\n')j++;row.push(cell);cell='';rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);rows.push(row);
  var out=rows.filter(function(r){return r.some(function(x){return x.trim();});});
  if(out.length&&/^(단어|word|english|영어|영단어)$/i.test(out[0][0].trim()))out.shift();
  return out.map(function(r){return {en:r[0],ko:r[1],ex:r[2],fd:r[3],lgName:r[4]};});
}
function csvCell(s){s=String(s==null?'':s);return /[",\n\r\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(){return '단어,뜻,예문,폴더,언어\n'+S.words.map(function(w){return [w.en,w.ko,w.ex,w.fd||'',langOf(w).name].map(csvCell).join(',');}).join('\n');}
async function readFileText(file){
  var buf=await file.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){try{return new TextDecoder('euc-kr').decode(buf);}catch(e2){return new TextDecoder().decode(buf);}}
}

  if(pdfLoading)return pdfLoading;
  pdfLoading=loadScript(PDFJS_BASE+'pdf.min.js').then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';
    return loadScript(PDFJS_BASE+'pdf.worker.min.js').catch(function(){});
  }).then(function(){return window.pdfjsLib;}).catch(function(e){pdfLoading=null;throw e;});
  return pdfLoading;
}
function groupLines(items){
  items.sort(function(a,b){return b.y-a.y;});
  var rows=[];
  items.forEach(function(it){
    var r=rows.length?rows[rows.length-1]:null;
    if(r&&Math.abs(r.y-it.y)<=3)r.items.push(it);else rows.push({y:it.y,items:[it]});
  });
  return rows.map(function(r){
    r.items.sort(function(a,b){return a.x-b.x;});
    var out='',end=null;
    r.items.forEach(function(it){
      if(end!==null&&it.x-end>1)out+=' ';
      out+=it.s;end=it.x+it.w;
    });
    return out;
  });
}
async function pdfToRows(file,onProgress){
  var lib=await loadPdfJs();
  var data=new Uint8Array(await file.arrayBuffer());
  var pdf=await lib.getDocument({data:data}).promise;
  var lines=[],chars=0;
  for(var pg=1;pg<=pdf.numPages;pg++){
    var page=await pdf.getPage(pg);
    var tc=await page.getTextContent();
    var items=[];
    tc.items.forEach(function(it){
      if(!it.str||!it.str.trim())return;
      chars+=it.str.length;
      items.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0});
    });
    lines=lines.concat(groupLines(items));
    if(onProgress)onProgress(pg,pdf.numPages);
  }
  return {rows:parseVocab(lines),chars:chars};
}
var FL='(?![\\uAC00-\\uD7A3\\u3131-\\u318E\\u1100-\\u11FF])[\\p{L}\\p{M}]';
var CHUNK_RE=new RegExp(FL+'(?:'+FL+'|[\'’\\-\\/.,;·・ 。、！？!?「」『』])*|(?:(?!'+FL+')[\\s\\S])+','gu');
var FL_START=new RegExp('^'+FL,'u');
var HAS_KO=/[가-힣]/;
var CJKRE=/[぀-ヿ㐀-鿿]/;
function wordCount(t){return t.trim()?t.trim().split(/\s+/).length:0;}
function isSentence(t){return wordCount(t)>=3||(CJKRE.test(t)&&t.replace(/\s/g,'').length>=6);}
function cleanEn(t){
  t=t.replace(/^\s*(?:(?:n|v|a|adj|adv|prep|conj|pron|vt|vi)\.\s+)+/i,'').replace(/(?:\s+(?:n|v|a|adj|adv|prep|conj|pron|vt|vi)\.)+\s*$/i,'').replace(/[\s.,;:]+$/,'').replace(/^[\s.,;:]+/,'').replace(/\s+/g,' ');
  if(!FL_START.test(t)||t.length<(CJKRE.test(t)?1:2)||t.length>48||wordCount(t)>5)return null;
  return t;
}
function cleanKo(t){
  return t.replace(/\s*\d+\s*[.)]?\s*$/,'').replace(/[\s(\[,;:·\/\-]+$/,'').replace(/^[\s:：=\-–→·.,)\]]+/,'').replace(/\s+/g,' ').trim();
}
function hasEx(en,t){
  if(!isSentence(t))return false;
  var first=en.toLowerCase().split(' ')[0],stem;
  if(CJKRE.test(first))stem=first.slice(0,Math.max(1,Math.min(first.length-1,2)));
  else stem=first.slice(0,Math.max(3,Math.min(first.length-2,6)));
  return t.toLowerCase().indexOf(stem)>=0;
}
function parseVocab(lines){
  var rows=[],last=null,day=null;
  lines.forEach(function(raw){
    var dm=raw.match(/^\s*day\s*0*(\d+)\b/i);
    if(dm){day=parseInt(dm[1],10);raw=raw.slice(dm[0].length);if(!HAS_KO.test(raw))return;}
    var line=raw.replace(/[(\[]\s*(n|v|a|adj|adv|prep|conj|pron|vt|vi)\.?\s*[)\]]/gi,function(m,x){return ' '+x+'. ';});
    line=line.replace(/^\s*(?:\d+\s*[.)]|[•·▪■□●○◦*\-–])\s*/,'');
    if(!HAS_KO.test(line)){
      var t=line.trim();
      if(last&&!last.ex&&hasEx(last.en,t))last.ex=t;
      return;
    }
    var chunks=line.match(CHUNK_RE)||[];
    var pending=null,here=null,made=[];
    chunks.forEach(function(c,i){
      var foreign=FL_START.test(c);
      if(foreign){
        var prev=i>0?chunks[i-1]:'';
        var next=chunks[i+1];
        if(pending&&/[(\[（]\s*$/.test(prev))return;
        if(here&&!pending){
          if(/[(\[（]\s*$/.test(prev))here.ko+=c;
          else if(next&&HAS_KO.test(next))pending=c;
          else if(!here.ex&&hasEx(here.en,c.trim()))here.ex=c.trim();
        }else pending=c;
      }else if(pending){
        if(HAS_KO.test(c)){
          var en=cleanEn(pending);
          pending=null;
          if(en){here={en:en,ko:c,ex:'',day:day};made.push(here);}else here=null;
        }
      }else if(here){here.ko+=c;}
    });
    made.forEach(function(r){
      r.ko=cleanKo(r.ko);
      if(r.ko&&HAS_KO.test(r.ko)){rows.push(r);last=r;}
    });
  });
  return rows;
}

var MODES=[
  ['mcq-meaning','뜻 고르기','외국어 단어를 보고 알맞은 한국어 뜻을 고릅니다.'],
  ['mcq-word','단어 고르기','한국어 뜻을 보고 알맞은 외국어 단어를 고릅니다.'],
  ['write-ko','뜻 쓰기','외국어 단어를 보고 한국어 뜻을 직접 씁니다.'],
  ['spell','철자 쓰기','한국어 뜻을 보고 외국어 단어를 직접 씁니다.']

function isTyped(mode){return mode==='spell'||mode==='write-ko';}
function koSegs(s){
  return String(s||'').replace(/\([^)]*\)|\[[^\]]*\]|（[^）]*）/g,' ').split(/[,;/·、，；\n]+/).map(function(x){return x.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}).filter(Boolean);
}
function koTokens(s){
  var out=koSegs(s);
  String(s||'').split(/[\s,;/·、，；]+/).forEach(function(x){x=x.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(x&&out.indexOf(x)<0)out.push(x);});
  return out;
}
function koMatch(w,typed){
  var ans=koSegs(w.ko),tk=koTokens(typed);
  return tk.some(function(t){return ans.some(function(a){return a===t||(t.length>=2&&a.indexOf(t)===0&&a.length-t.length<=2);});});
}
function typedOk(w,typed,mode){return mode==='write-ko'?koMatch(w,typed):norm(typed)===norm(w.en);}
function quizField(mode){return mode==='mcq-meaning'?'ko':'en';}
function buildQuiz(){
  var Q=S.quiz;
  var pool=scopedWords().map(function(w){return [Math.random()*(1+w.box),w];}).sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];});
  var picked=pool.slice(0,Math.min(Q.len,pool.length));

      var f=quizField(Q.mode),seen={},opts=[];seen[norm(w[f])]=1;var dp=distractorPool(f);

function quizPlay(){

  return [

        }})
      ),
      msg,
      h('p',{class:'eyebrow',text:'백업'}),
      h('div',{class:'btns'},h('button',{class:'btn',type:'button',text:'전체 단어를 CSV로 복사',disabled:S.words.length?null:true,onclick:async function(){
        var text=toCSV();
        try{await navigator.clipboard.writeText(text);copyMsg.className='msg ok';copyMsg.textContent='복사했어요. 메모장이나 엑셀에 붙여넣어 보관하세요.';csvOut.hidden=true;}
        catch(e){csvOut.value=text;csvOut.hidden=false;csvOut.focus();csvOut.select();copyMsg.className='msg';copyMsg.textContent='자동 복사가 막혀 있어요. 아래 내용을 직접 복사해 주세요.';}
      }})),
      copyMsg,csvOut
    )
  );
  if(V.openImport||V.importOpen){d.open=true;V.openImport=false;}
  return [pdfBox,d];
}
function searchRow(host){
  var V=S.vocab;
  var inp=h('input',{type:'search',id:'search',value:V.q,placeholder:'단어나 뜻으로 찾기','aria-label':'단어 검색',autocomplete:'off',oninput:function(){V.q=inp.value;V.limit=100;renderList();}});
  return h('div',{style:'display:grid;gap:10px;margin-bottom:.5rem'},h('p',{class:'eyebrow',id:'list-count'}),inp);
}
function renderList(){
  var host=$('#list-host');if(!host)return;
  var V=S.vocab;
  var q=norm(V.q);
  var all=S.words.slice().reverse().filter(function(w){return inScope(w)&&(!q||w.en.toLowerCase().indexOf(q)>=0||w.ko.toLowerCase().indexOf(q)>=0);});
  var count=$('#list-count');if(count)count.textContent='단어 '+all.length+(q?'개 찾음':'개');
  host.replaceChildren();
  if(!all.length){host.append(h('p',{class:'note',text:langWords().length?'찾는 단어가 없어요.':'아직 단어가 없어요.'}));return;}
  var shown=all.slice(0,V.limit);
  var ul=h('ul',{class:'list'});
  shown.forEach(function(w){ul.append(V.editing===w.seq?editRow(w):itemRow(w));});
  host.append(ul);
  if(all.length>shown.length){host.append(h('div',{class:'btns',style:'margin-top:.75rem'},h('button',{class:'btn',type:'button',text:'더 보기 ('+(all.length-shown.length)+')',onclick:function(){V.limit+=100;renderList();}})));}
}
function itemRow(w){
  var V=S.vocab;
  var pill=!w.seen?h('span',{class:'pill new',text:'새 단어'}):(w.box>=5?h('span',{class:'pill done',text:'상자 '+w.box}):h('span',{class:'pill',text:w.box===0?'다시':'상자 '+w.box}));
  var confirming=V.confirmDel===w.seq;
  return h('li',{class:'item'},
    h('div',{class:'main'},h('span',{class:'en',text:w.en,lang:langOf(w).tts||null}),h('span',{class:'ko',text:w.ko}),w.ex?h('span',{class:'exs',text:w.ex}):null),
    h('div',{class:'line'},pill,moveSelect(w),
      h('div',{class:'btns'},
        h('button',{class:'btn sm',type:'button',text:'수정','aria-label':w.en+' 수정',onclick:function(){V.editing=w.seq;V.confirmDel=null;renderList();}}),
        h('button',{class:'btn sm danger',type:'button',text:confirming?'정말 삭제':'삭제','aria-label':w.en+' 삭제',onclick:function(){
          if(confirming){V.confirmDel=null;removeWord(w.seq);renderList();renderTabs();}
          else{V.confirmDel=w.seq;renderList();setTimeout(function(){if(V.confirmDel===w.seq){V.confirmDel=null;renderList();}},3500);}
        }})
      )
    )
  );
}
function editRow(w){
  var V=S.vocab;
  var en=h('input',{type:'text',value:w.en,'aria-label':'단어',autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
  var ko=h('input',{type:'text',value:w.ko,'aria-label':'뜻',autocomplete:'off'});
  var ex=h('input',{type:'text',value:w.ex||'','aria-label':'예문',autocomplete:'off'});
  return h('li',{class:'item'},h('form',{class:'form',onsubmit:function(e){
    e.preventDefault();
    var a=en.value.trim().slice(0,80),b=ko.value.trim().slice(0,200);
    if(!a||!b)return;
    var clash=S.words.some(function(o){return o.seq!==w.seq&&wordLang(o)===wordLang(w)&&o.en.toLowerCase()===a.toLowerCase();});
    if(clash)return;
    w.en=a;w.ko=b;w.ex=ex.value.trim().slice(0,300);touch(w);V.editing=null;renderList();
  }},
    h('div',{class:'two'},en,ko),ex,
    h('div',{class:'btns'},
      h('button',{class:'btn primary sm',type:'submit',text:'저장'}),
      h('button',{class:'btn sm',type:'button',text:'취소',onclick:function(){V.editing=null;renderList();}})
    )
  ));
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.matches&&t.matches('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.tab==='review'&&S.review&&S.review.i<S.review.queue.length){
    var R=S.review;
    if(R.flipped){var g={'1':'again','2':'hard','3':'good'}[e.key];if(g){e.preventDefault();answerReview(g);}}
    else if(e.key===' '&&t===document.body){e.preventDefault();R.flipped=true;renderView();}
  }else if(S.tab==='cards'&&S.free.ids.length){
    var F=S.free;
    if(e.key==='ArrowRight'){F.i=(F.i+1)%F.ids.length;F.flipped=false;renderView();}
    else if(e.key==='ArrowLeft'){F.i=(F.i-1+F.ids.length)%F.ids.length;F.flipped=false;renderView();}
  }
});

/* ---------- boot ---------- */
renderStatus();renderTabs();renderView();
initStore().then(function(){renderStatus();renderTabs();renderView();initSample();});
})();
</script>

</body>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>word box</title><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=block">
<style>
/* Layout: a single narrow column. Index cards (red header rule, blue ruled lines) carry the study; Leitner drawers show progress. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1B261F; --muted:#586459; --line:#D5DCD3;
  --accent:#3F7355; --accent-ink:#FFFFFF; --accent-soft:#E0EBE2;
  --hl:#FFE56A; --hl-ink:#1B261F;
  --card:#FFFFFF; --rule-red:#EE8A92; --rule-blue:#DCE8DD;
  --good:#17724A; --good-bg:#DDF3E7; --warn:#80530A; --warn-bg:#FBEED2; --bad:#A6313F; --bad-bg:#FBE3E6;
  --shadow:0 1px 0 rgba(27,38,31,.05),0 10px 26px -14px rgba(27,38,31,.3);
  --f-display:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
  --f-body:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
  --f-mono:'Helvetica Neue',Helvetica,Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Noto Sans CJK JP',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18221C; --ink:#E6EEE7; --muted:#9DAEA1; --line:#2B3A30;
    --accent:#8CBF9F; --accent-ink:#0F1612; --accent-soft:#25382B;
    --hl:#5E5314; --hl-ink:#FFF0A0;
    --card:#1C2820; --rule-red:#8E4A55; --rule-blue:#2C3F32;
    --good:#74D8A6; --good-bg:#163B2C; --warn:#F2C56E; --warn-bg:#3C2E12; --bad:#FF9CA8; --bad-bg:#40202B;
    --shadow:0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --ink:#E6EEE7; --muted:#9DAEA1; --line:#2B3A30;
  --accent:#8CBF9F; --accent-ink:#0F1612; --accent-soft:#25382B;
  --hl:#5E5314; --hl-ink:#FFF0A0;
  --card:#1C2820; --rule-red:#8E4A55; --rule-blue:#2C3F32;
  --good:#74D8A6; --good-bg:#163B2C; --warn:#F2C56E; --warn-bg:#3C2E12; --bad:#FF9CA8; --bad-bg:#40202B;
  --shadow:0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-synthesis:none;
  font-variant-numeric:tabular-nums;
  background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:42rem;margin-inline:auto;display:grid;gap:18px;min-width:0}
.wrap>*{min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;margin:0;font:700 1.5rem/1.2 var(--f-display);letter-spacing:-.01em}
.brand svg{color:var(--accent);flex:none}
.status{display:flex;align-items:center;gap:.45rem;font:400 .75rem/1.3 var(--f-mono);color:var(--muted)}
.status i{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted);flex:none}
.status.ok i{background:var(--good)}
.status.busy i{background:var(--warn)}
.status.warn i{background:var(--warn)}
.status.bad i{background:var(--bad)}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,22,18,.55)}
.gatebox{width:100%;max-width:360px;display:grid;gap:12px;padding:20px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px}
.gatebox h2{margin:0;font:700 1.15rem/1.3 var(--f-display)}
.gatebox p{margin:0}
.gatebox input{min-height:2.75rem;padding:0 .8rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.status .namebtn{color:var(--ink);font-weight:700;text-decoration:none}
.typ-target{display:block;font:400 1.25rem/1.9 var(--f-body);overflow-wrap:anywhere;user-select:none}
.tch{border-radius:3px;color:var(--muted)}
.tch.ok{color:var(--good)}
.tch.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);text-decoration:underline}
.tch.cur{color:var(--ink)}
.tch.next{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.typ-in{font-size:1.125rem}
.lb{margin:0;padding:0;list-style:none;display:grid}
.lb li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:8px;align-items:center;padding:.55rem .4rem;border-top:1px solid var(--line)}
.lb li.me{background:var(--accent-soft);border-radius:6px;font-weight:700}
.lb .rk{font:700 .875rem/1 var(--f-mono);color:var(--muted)}
.lb .nm{overflow-wrap:anywhere}
.lb .sc{font:700 .9375rem/1 var(--f-mono)}
.status button{border:0;background:none;padding:0;font:inherit;color:var(--bad);text-decoration:underline}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{min-height:2.75rem;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.4rem .25rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{font:700 .75rem/1 var(--f-mono);padding:.2rem .4rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tab[aria-selected="true"] .badge{background:var(--accent-ink);color:var(--accent)}

.panel{display:grid;gap:16px;align-content:start}
.panel>*{min-width:0}

/* generic */
.eyebrow{margin:0;font:700 .75rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:2.75rem;padding:0 1.1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:2.25rem;padding:0 .8rem;font-size:.875rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:2.25rem;padding:0 .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.875rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.note{color:var(--muted);font-size:.9375rem;margin:0}
.msg{margin:0;font-size:.9375rem;min-height:1.4em}
.msg.ok{color:var(--good)}
.msg.bad{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 .8125rem/1.3 var(--f-mono);color:var(--muted)}

/* review home */
.hero{display:grid;gap:.5rem}
.big{margin:0;font:700 1.75rem/1.25 var(--f-body);text-wrap:balance}
.num{font:700 2.25rem/1 var(--f-display);padding:0 .1em;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.sub{margin:0;color:var(--muted)}
.hero .btns{margin-top:.5rem}
.drawers{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end}
.drawer{display:grid;grid-template-rows:auto 4.5rem auto;justify-items:center;gap:4px;min-width:0}
.drawer .n{font:700 .8125rem/1 var(--f-mono)}
.drawer .col{align-self:stretch;display:flex;align-items:flex-end}
.drawer .bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.drawer.zero .n{color:var(--muted)}
.drawer .l{font:400 .6875rem/1.2 var(--f-mono);color:var(--muted);white-space:nowrap}
.onboard pre{margin:.5rem 0 0;padding:.75rem;border-radius:8px;background:var(--bg);font:400 .8125rem/1.6 var(--f-mono);overflow-x:auto;white-space:pre}

/* index card */
.cardwrap{position:relative}
.card{
  display:grid;grid-template-rows:3.1rem 1fr;min-height:18rem;border:1px solid var(--line);border-radius:8px;
  background-color:var(--card);
  background-image:linear-gradient(var(--rule-red),var(--rule-red)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2rem - 1px),var(--rule-blue) calc(2rem - 1px),var(--rule-blue) 2rem);
  background-size:100% 2px,100% calc(100% - 3.1rem);
  background-position:0 calc(3.1rem - 2px),0 3.1rem;
  background-repeat:no-repeat;
  box-shadow:var(--shadow);cursor:pointer;-webkit-user-select:none;user-select:none;
}
.card-head{display:flex;align-items:center;padding:0 3.2rem 0 1.1rem;font:400 .75rem/1.3 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.card-body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;padding:1rem 1.25rem 1.25rem;min-width:0}
.headword{font:700 clamp(2.2rem,9vw,3.1rem)/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere;padding:0 .12em;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.headword.sm{font-size:clamp(1.7rem,7vw,2.2rem)}
.meaning-big{font:700 clamp(1.6rem,6.5vw,2.1rem)/1.3 var(--f-body);overflow-wrap:anywhere}
.meaning{font:700 1.5rem/1.35 var(--f-body);overflow-wrap:anywhere}
.answer{min-height:6.5rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5rem;max-width:100%}
.answer.on{animation:rise .22s ease-out}
.hint{color:var(--muted);font-size:.9375rem;margin:0}
.ex{margin:0;color:var(--muted);font:400 1.0625rem/1.5 var(--f-body);overflow-wrap:anywhere}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:2px}
.speak{position:absolute;top:.3rem;right:.4rem;width:2.5rem;height:2.5rem;border-radius:999px;border:0;background:transparent;color:var(--accent);display:grid;place-items:center}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{min-height:3.75rem;border-radius:8px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);display:grid;place-items:center;align-content:center;gap:.15rem;padding:.4rem;font-weight:700;line-height:1.2}
.gbtn small{font:400 .75rem/1.2 var(--f-mono)}
.gbtn.again{background:var(--bad-bg);color:var(--bad)}
.gbtn.hard{background:var(--warn-bg);color:var(--warn)}
.gbtn.good{background:var(--good-bg);color:var(--good)}
.reveal{width:100%;min-height:3.75rem}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:.75rem;background:var(--surface);text-align:center}
.stat b{display:block;font:700 1.5rem/1.2 var(--f-display)}
.stat span{font-size:.8125rem;color:var(--muted)}

/* quiz */
.options{display:grid;gap:8px}
.opt{min-height:3.25rem;text-align:left;padding:.6rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;overflow-wrap:anywhere}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.modes{display:grid;gap:8px}
.mode{text-align:left;padding:.75rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;gap:.1rem}
.mode b{font-weight:700}
.mode span{font-size:.875rem;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.fb{margin:0;font-weight:700}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.pattern{font:700 1.125rem/1.4 var(--f-mono);letter-spacing:.15em;color:var(--muted)}
.wronglist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.wronglist li{display:flex;justify-content:space-between;gap:12px;padding:.6rem 0;border-top:1px solid var(--line)}
.wronglist b{font-family:var(--f-display);font-size:1.0625rem}
.wronglist span{color:var(--muted);text-align:right;overflow-wrap:anywhere}

/* words */
label.f{display:grid;gap:.3rem;font-size:.8125rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=search],textarea{width:100%;min-height:2.75rem;padding:.5rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:7.5rem;font:400 .875rem/1.6 var(--f-body);resize:vertical}
input[type=file]{max-width:100%;font-size:.875rem}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.box>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";font:400 1.25rem/1 var(--f-mono);color:var(--muted)}
details.box[open]>summary::after{content:"\2212"}
details.box .inner{display:grid;gap:12px;margin-top:.9rem}
.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.item{display:grid;gap:.5rem;padding:.8rem 0;border-top:1px solid var(--line)}
.item .main{display:grid;gap:.15rem;min-width:0}
.item .en{font:700 1.1875rem/1.3 var(--f-display);overflow-wrap:anywhere}
.item .ko{overflow-wrap:anywhere}
.item .exs{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.item .line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font:700 .75rem/1 var(--f-mono);padding:.3rem .5rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.new{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--good-bg);color:var(--good)}

.bars{display:flex;gap:12px;flex-wrap:wrap}
.bars .scopebar{flex:1 1 11rem;min-width:0}
.scopebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scopebar select{flex:1;min-width:0;max-width:18rem;min-height:2.75rem}
select{max-width:100%;min-height:2.25rem;padding:.3rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
@media (max-width:420px){
  .form .two{grid-template-columns:1fr}
  .tab{font-size:.8125rem;padding:.4rem .1rem;gap:.2rem}
}
@media (prefers-reduced-motion:reduce){
  .answer.on{animation:none}
  .meter span{transition:none}
}
</style></head><body>

<div class="wrap">

    <h1 class="brand">

async function flush(){
  clearTimeout(timer);timer=null;
  if(saving){again=true;return;}
  lsWrite();

  if(!dirty.size){S.saveState='saved';renderStatus();return;}

/* ---------- word operations ---------- */
function addWords(rows,defFd){
  var have=new Set(S.words.map(function(w){return wordLang(w)+'|'+w.en.toLowerCase();}));
  var added=0,dup=0,bad=0;
  rows.forEach(function(r){
    var en=String(r.en||'').trim().slice(0,80),ko=String(r.ko||'').trim().slice(0,200),ex=String(r.ex||'').trim().slice(0,300);
    if(!en||!ko){bad++;return;}
    var lg=(r.lgName&&String(r.lgName).trim())?ensureLangByName(r.lgName):S.lang;var k=lg+'|'+en.toLowerCase();
    if(have.has(k)){dup++;return;}
    if(S.words.length>=MAX_WORDS){bad++;return;}
    have.add(k);
    var fd=cleanFolderName(r.fd!=null&&String(r.fd).trim()?r.fd:defFd)||'';ensureFolder(fd);
    var w={seq:S.next++,en:en,ko:ko,ex:ex,fd:fd,lg:lg,box:0,due:today(),seen:0,wrong:0,first:0};
    S.words.push(w);dirty.add(chunkOf(w));added++;
  });
  if(added){S.free.built=false;logAct('a',added);}
  return {added:added,dup:dup,bad:bad};
}
function removeWord(seq){
  var w=bySeq(seq);if(!w)return;
  dirty.add(chunkOf(w));
  S.words=S.words.filter(function(x){return x.seq!==seq;});
  S.free.built=false;queueSave();
}
function grade(w,g){
  var t=today();logAct('r',1);if(g!=='again')logAct('rc',1);
  if(!w.seen)w.first=t;
  w.seen=(w.seen||0)+1;
  if(g==='again'){w.box=0;w.due=t;w.wrong=(w.wrong||0)+1;}
  else if(g==='hard'){w.box=Math.max(1,w.box);w.due=t+1;}
  else{w.box=Math.min(6,w.box+1);w.due=t+INTERVALS[w.box];}
}
function dueList(){var t=today();return S.words.filter(function(w){return inScope(w)&&w.seen>0&&w.due<=t;});}
function unseenList(){return S.words.filter(function(w){return inScope(w)&&!w.seen;});}
function newBudget(){var t=today();return Math.max(0,NEW_PER_DAY-S.words.filter(function(w){return wordLang(w)===S.lang&&w.first===t;}).length);}
function availToday(){return dueList().length+Math.min(newBudget(),unseenList().length);}

/* ---------- CSV ---------- */
function parseTable(text){
  text=String(text).replace(/^\uFEFF/,'');
  var lines=text.split(/\r?\n/);
  var first='';for(var i=0;i<lines.length;i++){if(lines[i].trim()){first=lines[i];break;}}
  var delim=first.indexOf('\t')>=0?'\t':',';
  var rows=[],row=[],cell='',q=false;
  for(var j=0;j<text.length;j++){
    var c=text[j];
    if(q){
      if(c==='"'){if(text[j+1]==='"'){cell+='"';j++;}else q=false;}
      else cell+=c;
    }else if(c==='"'&&cell===''){q=true;}
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[j+1]==='\n')j++;row.push(cell);cell='';rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);rows.push(row);
  var out=rows.filter(function(r){return r.some(function(x){return x.trim();});});
  if(out.length&&/^(단어|word|english|영어|영단어)$/i.test(out[0][0].trim()))out.shift();
  return out.map(function(r){return {en:r[0],ko:r[1],ex:r[2],fd:r[3],lgName:r[4]};});
}
function csvCell(s){s=String(s==null?'':s);return /[",\n\r\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(){return '단어,뜻,예문,폴더,언어\n'+S.words.map(function(w){return [w.en,w.ko,w.ex,w.fd||'',langOf(w).name].map(csvCell).join(',');}).join('\n');}
async function readFileText(file){
  var buf=await file.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){try{return new TextDecoder('euc-kr').decode(buf);}catch(e2){return new TextDecoder().decode(buf);}}
}

var PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var pdfLoading=null;
function loadScript(src){
  return new Promise(function(res,rej){
    var el=document.createElement('script');
    el.src=src;el.onload=res;el.onerror=function(){rej(new Error('script'));};
    document.head.append(el);
  });
}
function loadPdfJs(){
  if(pdfLoading)return pdfLoading;
  pdfLoading=loadScript(PDFJS_BASE+'pdf.min.js').then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';
    return loadScript(PDFJS_BASE+'pdf.worker.min.js').catch(function(){});
  }).then(function(){return window.pdfjsLib;}).catch(function(e){pdfLoading=null;throw e;});
  return pdfLoading;
}
function groupLines(items){
  items.sort(function(a,b){return b.y-a.y;});
  var rows=[];
  items.forEach(function(it){
    var r=rows.length?rows[rows.length-1]:null;
    if(r&&Math.abs(r.y-it.y)<=3)r.items.push(it);else rows.push({y:it.y,items:[it]});
  });
  return rows.map(function(r){
    r.items.sort(function(a,b){return a.x-b.x;});
    var out='',end=null;
    r.items.forEach(function(it){
      if(end!==null&&it.x-end>1)out+=' ';
      out+=it.s;end=it.x+it.w;
    });
    return out;
  });
}
async function pdfToRows(file,onProgress){
  var lib=await loadPdfJs();
  var data=new Uint8Array(await file.arrayBuffer());
  var pdf=await lib.getDocument({data:data}).promise;
  var lines=[],chars=0;
  for(var pg=1;pg<=pdf.numPages;pg++){
    var page=await pdf.getPage(pg);
    var tc=await page.getTextContent();
    var items=[];
    tc.items.forEach(function(it){
      if(!it.str||!it.str.trim())return;
      chars+=it.str.length;
      items.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0});
    });
    lines=lines.concat(groupLines(items));
    if(onProgress)onProgress(pg,pdf.numPages);
  }
  return {rows:parseVocab(lines),chars:chars};
}
var FL='(?![\\uAC00-\\uD7A3\\u3131-\\u318E\\u1100-\\u11FF])[\\p{L}\\p{M}]';
var CHUNK_RE=new RegExp(FL+'(?:'+FL+'|[\'’\\-\\/.,;·・ 。、！？!?「」『』])*|(?:(?!'+FL+')[\\s\\S])+','gu');
var FL_START=new RegExp('^'+FL,'u');
var HAS_KO=/[가-힣]/;
var CJKRE=/[぀-ヿ㐀-鿿]/;
function wordCount(t){return t.trim()?t.trim().split(/\s+/).length:0;}
function isSentence(t){return wordCount(t)>=3||(CJKRE.test(t)&&t.replace(/\s/g,'').length>=6);}
function cleanEn(t){
  t=t.replace(/^\s*(?:(?:n|v|a|adj|adv|prep|conj|pron|vt|vi)\.\s+)+/i,'').replace(/(?:\s+(?:n|v|a|adj|adv|prep|conj|pron|vt|vi)\.)+\s*$/i,'').replace(/[\s.,;:]+$/,'').replace(/^[\s.,;:]+/,'').replace(/\s+/g,' ');
  if(!FL_START.test(t)||t.length<(CJKRE.test(t)?1:2)||t.length>48||wordCount(t)>5)return null;
  return t;
}
function cleanKo(t){
  return t.replace(/\s*\d+\s*[.)]?\s*$/,'').replace(/[\s(\[,;:·\/\-]+$/,'').replace(/^[\s:：=\-–→·.,)\]]+/,'').replace(/\s+/g,' ').trim();
}
function hasEx(en,t){
  if(!isSentence(t))return false;
  var first=en.toLowerCase().split(' ')[0],stem;
  if(CJKRE.test(first))stem=first.slice(0,Math.max(1,Math.min(first.length-1,2)));
  else stem=first.slice(0,Math.max(3,Math.min(first.length-2,6)));
  return t.toLowerCase().indexOf(stem)>=0;
}
function parseVocab(lines){
  var rows=[],last=null,day=null;
  lines.forEach(function(raw){
    var dm=raw.match(/^\s*day\s*0*(\d+)\b/i);
    if(dm){day=parseInt(dm[1],10);raw=raw.slice(dm[0].length);if(!HAS_KO.test(raw))return;}
    var line=raw.replace(/[(\[]\s*(n|v|a|adj|adv|prep|conj|pron|vt|vi)\.?\s*[)\]]/gi,function(m,x){return ' '+x+'. ';});
    line=line.replace(/^\s*(?:\d+\s*[.)]|[•·▪■□●○◦*\-–])\s*/,'');
    if(!HAS_KO.test(line)){
      var t=line.trim();
      if(last&&!last.ex&&hasEx(last.en,t))last.ex=t;
      return;
    }
    var chunks=line.match(CHUNK_RE)||[];
    var pending=null,here=null,made=[];
    chunks.forEach(function(c,i){
      var foreign=FL_START.test(c);
      if(foreign){
        var prev=i>0?chunks[i-1]:'';
        var next=chunks[i+1];
        if(pending&&/[(\[（]\s*$/.test(prev))return;
        if(here&&!pending){
          if(/[(\[（]\s*$/.test(prev))here.ko+=c;
          else if(next&&HAS_KO.test(next))pending=c;
          else if(!here.ex&&hasEx(here.en,c.trim()))here.ex=c.trim();
        }else pending=c;
      }else if(pending){
        if(HAS_KO.test(c)){
          var en=cleanEn(pending);
          pending=null;
          if(en){here={en:en,ko:c,ex:'',day:day};made.push(here);}else here=null;
        }
      }else if(here){here.ko+=c;}
    });
    made.forEach(function(r){
      r.ko=cleanKo(r.ko);
      if(r.ko&&HAS_KO.test(r.ko)){rows.push(r);last=r;}
    });
  });
  return rows;
}

/* ---------- quiz ---------- */
var MODES=[
  ['mcq-meaning','뜻 고르기','외국어 단어를 보고 알맞은 한국어 뜻을 고릅니다.'],
  ['mcq-word','단어 고르기','한국어 뜻을 보고 알맞은 외국어 단어를 고릅니다.'],
  ['write-ko','뜻 쓰기','외국어 단어를 보고 한국어 뜻을 직접 씁니다.'],
  ['spell','철자 쓰기','한국어 뜻을 보고 외국어 단어를 직접 씁니다.']
];
function isTyped(mode){return mode==='spell'||mode==='write-ko';}
function koSegs(s){
  return String(s||'').replace(/\([^)]*\)|\[[^\]]*\]|（[^）]*）/g,' ').split(/[,;/·、，；\n]+/).map(function(x){return x.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}).filter(Boolean);
}
function koTokens(s){
  var out=koSegs(s);
  String(s||'').split(/[\s,;/·、，；]+/).forEach(function(x){x=x.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(x&&out.indexOf(x)<0)out.push(x);});
  return out;
}
function koMatch(w,typed){
  var ans=koSegs(w.ko),tk=koTokens(typed);
  return tk.some(function(t){return ans.some(function(a){return a===t||(t.length>=2&&a.indexOf(t)===0&&a.length-t.length<=2);});});
}
function typedOk(w,typed,mode){return mode==='write-ko'?koMatch(w,typed):norm(typed)===norm(w.en);}
function quizField(mode){return mode==='mcq-meaning'?'ko':'en';}
function buildQuiz(){
  var Q=S.quiz;
  var pool=scopedWords().map(function(w){return [Math.random()*(1+w.box),w];}).sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];});
  var picked=pool.slice(0,Math.min(Q.len,pool.length));
  Q.qs=picked.map(function(w){
    var q={seq:w.seq};
    if(!isTyped(Q.mode)){
      var f=quizField(Q.mode),seen={},opts=[];seen[norm(w[f])]=1;var dp=distractorPool(f);
      shuffle(dp).forEach(function(o){
        if(opts.length>=3)return;
        var k=norm(o[f]);if(seen[k])return;seen[k]=1;opts.push(o[f]);
      });
      q.options=shuffle(opts.concat([w[f]]));
    }
    return q;
  });
  Q.phase='play';Q.i=0;Q.answered=false;Q.picked=null;Q.typed='';Q.score=0;Q.wrong=[];Q.sent=false;
}
function quizWrong(w){
  w.wrong=(w.wrong||0)+1;
  if(w.seen){w.box=Math.max(0,w.box-1);w.due=today();}
  touch(w);
}
function viewQuiz(){
  if(!langWords().length)return emptyDeck();
  var Q=S.quiz;
  if(Q.phase==='play'&&Q.i<Q.qs.length)return quizPlay();
  if(Q.phase==='result')return quizResult();
  return quizSetup();
}
function distinctCount(field){var s={};langWords().forEach(function(w){s[norm(w[field])]=1;});return Object.keys(s).length;}
function quizSetup(){
  var Q=S.quiz;
  if(!scopedWords().length)return emptyScope();
  var enough=langWords().length>=4&&distinctCount('ko')>=4&&distinctCount('en')>=4;
  var needsMcq=!isTyped(Q.mode);
  return [
    h('section',{class:'box',style:'display:grid;gap:14px'},
      h('p',{class:'eyebrow',text:'유형'}),
      h('div',{class:'modes'},MODES.map(function(m){
        return h('button',{class:'mode',type:'button','aria-pressed':String(Q.mode===m[0]),onclick:function(){Q.mode=m[0];renderView();}},h('b',{text:m[1]}),h('span',{text:m[2]}));
      })),
      h('p',{class:'eyebrow',text:'문제 수'}),
      h('div',{class:'chips',role:'group','aria-label':'문제 수'},[10,20,30].map(function(n){
        return h('button',{class:'chip',type:'button','aria-pressed':String(Q.len===n),text:n+'문제',onclick:function(){Q.len=n;renderView();}});
      })),
      (needsMcq&&!enough)?h('p',{class:'msg bad',text:'객관식은 서로 다른 단어가 4개 이상 있어야 해요. 단어를 더 추가하거나 쓰기 유형을 골라 주세요.'}):null,
      h('div',{class:'btns'},h('button',{class:'btn primary',type:'button',text:'퀴즈 시작',disabled:(needsMcq&&!enough)?true:null,onclick:function(){buildQuiz();renderView();}}))
    ),
    h('p',{class:'note',text:'복습이 덜 된 단어가 더 자주 나와요. 틀린 단어는 오늘 복습에 다시 들어가요.'})
  ];
}
function quizPlay(){
  var Q=S.quiz,q=Q.qs[Q.i],w=bySeq(q.seq);
  if(!w){Q.i++;if(Q.i>=Q.qs.length)Q.phase='result';return viewQuiz();}
  var pct=Math.round(Q.i/Q.qs.length*100);
  var isSpell=Q.mode==='spell',typedMode=isTyped(Q.mode);
  var prompt;
  if(Q.mode==='mcq-meaning'||Q.mode==='write-ko'){
    prompt=h('div',{class:'headword',text:w.en,lang:langOf(w).tts||null});
  }else{
    prompt=h('div',{class:'meaning-big',text:w.ko});
  }
  var wrap=h('div',{class:'cardwrap'},
    h('div',{class:'card',style:'cursor:default;min-height:13rem'},
      h('div',{class:'card-head',text:(Q.i+1)+' / '+Q.qs.length+' · '+MODES.filter(function(m){return m[0]===Q.mode;})[0][1]}),
      h('div',{class:'card-body'},prompt,isSpell?h('div',{class:'pattern','aria-label':w.en.length+'글자',text:w.en.charAt(0)+' '+w.en.slice(1).replace(/[^\s]/g,'_').split('').join(' ')}):null)
    )
  );
  if(canSpeak&&langOf(w).tts&&(Q.mode==='mcq-meaning'||Q.mode==='write-ko')){
    var sp=h('button',{class:'speak',type:'button','aria-label':'발음 듣기',onclick:function(){speak(w.en,langOf(w).tts);}});sp.innerHTML=ICON_SPEAK;wrap.append(sp);
  }
  var body;
  if(!typedMode){
    var f=quizField(Q.mode);
    body=h('div',{class:'options'},q.options.map(function(o){
      var cls='opt';
      if(Q.answered){if(norm(o)===norm(w[f]))cls+=' right';else if(o===Q.picked)cls+=' wrong';}
      return h('button',{class:cls,type:'button',disabled:Q.answered?true:null,text:o,onclick:function(){
        Q.answered=true;Q.picked=o;
        var okq=norm(o)===norm(w[f]);logQ(okq);if(okq)Q.score++;else{Q.wrong.push(w.seq);quizWrong(w);}
        renderView();
      }});
    }));
  }else{
    var input=h('input',{type:'text',id:'quiz-typed',value:Q.typed,autocomplete:'off',autocapitalize:'off',spellcheck:'false',lang:(Q.mode==='write-ko'?'ko':(langOf(w).tts||null)),'aria-label':(Q.mode==='write-ko'?'한국어 뜻 입력':L().name+' 단어 입력'),disabled:Q.answered?true:null,'data-autofocus':Q.answered?null:'1'});
    body=h('form',{class:'form',onsubmit:function(e){
      e.preventDefault();if(Q.answered)return;
      Q.typed=input.value;Q.answered=true;
      var okt=typedOk(w,Q.typed,Q.mode);logQ(okt);if(okt)Q.score++;else{Q.wrong.push(w.seq);quizWrong(w);}
      renderView();
    }},input,Q.answered?null:h('button',{class:'btn primary',type:'submit',text:'확인'}));
  }
  var fb=null;
  if(Q.answered){
    var ok=typedMode?typedOk(w,Q.typed,Q.mode):norm(Q.picked)===norm(w[quizField(Q.mode)]);
    fb=h('div',{style:'display:grid;gap:6px'},
      h('p',{class:'fb '+(ok?'ok':'bad'),text:ok?'정답이에요':'아쉬워요'}),
      ok?null:h('p',{class:'note',text:'정답: '+((Q.mode==='mcq-meaning'||Q.mode==='write-ko')?w.ko:w.en+' · '+w.ko)}),
      exampleNode(w)
    );
  }
  var last=Q.i+1>=Q.qs.length;
  var next=Q.answered?h('div',{class:'btns'},h('button',{class:'btn primary',type:'button','data-autofocus':'1',text:last?'결과 보기':'다음',onclick:function(){
    Q.i++;Q.answered=false;Q.picked=null;Q.typed='';
    if(Q.i>=Q.qs.length)Q.phase='result';
    renderView();
  }})):null;
  return [
    h('div',{class:'meta-row'},h('span',{text:'맞힌 문제 '+Q.score}),h('button',{class:'btn ghost sm',type:'button',text:'그만하기',onclick:function(){Q.phase='setup';renderView();}})),
    h('div',{class:'meter',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(pct),'aria-label':'진행률'},h('span',{style:'width:'+pct+'%'})),
    wrap,body,fb,next
  ];
}
function quizResult(){
  var Q=S.quiz,n=Q.qs.length;
  if(!Q.sent){Q.sent=true;if(n>=5)postScore('quiz',{correct:Q.score,total:n}).then(function(){if(API.user)loadLb(true);});}
  var wrongWords=Q.wrong.map(bySeq).filter(Boolean);
  return [
    h('section',{class:'hero'},
      h('p',{class:'eyebrow',text:'퀴즈 결과'}),
      h('h2',{class:'big'},n+'문제 중 ',h('span',{class:'num',text:Q.score}),'개 맞혔어요'),
      h('p',{class:'sub',text:wrongWords.length?'틀린 단어는 오늘 복습에 다시 들어가요.':'모두 맞혔어요.'})
    ),
    wrongWords.length?h('section',{class:'box'},h('p',{class:'eyebrow',text:'틀린 단어'}),h('ul',{class:'wronglist',style:'margin-top:.5rem'},wrongWords.map(function(w){return h('li',null,h('b',{text:w.en}),h('span',{text:w.ko}));}))):null,
    h('div',{class:'btns'},
      h('button',{class:'btn primary',type:'button',text:'다시 풀기',onclick:function(){buildQuiz();renderView();}}),
      h('button',{class:'btn',type:'button',text:'설정으로',onclick:function(){Q.phase='setup';renderView();}})
    )
  ];
}

document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.matches&&t.matches('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.tab==='review'&&S.review&&S.review.i<S.review.queue.length){
    var R=S.review;
    if(R.flipped){var g={'1':'again','2':'hard','3':'good'}[e.key];if(g){e.preventDefault();answerReview(g);}}
    else if(e.key===' '&&t===document.body){e.preventDefault();R.flipped=true;renderView();}
  }else if(S.tab==='cards'&&S.free.ids.length){
    var F=S.free;
    if(e.key==='ArrowRight'){F.i=(F.i+1)%F.ids.length;F.flipped=false;renderView();}
    else if(e.key==='ArrowLeft'){F.i=(F.i-1+F.ids.length)%F.ids.length;F.flipped=false;renderView();}
  }
});

var API={ok:false,clientId:'',ocr:false,token:'',user:null,msg:null,gsi:false};

async function api(method,path,body){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},path==='ocr'?90000:15000);
  try{
    var res=await fetch('/api/'+path,{method:method,headers:Object.assign({'content-type':'application/json'},API.token?{authorization:'Bearer '+API.token}:{}),body:body?JSON.stringify(body):undefined,signal:ctl.signal});
    var data=null;try{data=await res.json();}catch(e){}
    if(res.status===401&&API.token&&path!=='login'&&path!=='ocr'){logout();}
    if(!res.ok){var er=new Error('api');er.code=(data&&data.error)||('http_'+res.status);throw er;}
    return data;
  }finally{clearTimeout(tm);}
}

function snapshot(){
  var keep={},ks=Object.keys(S.hist).sort().slice(-400);ks.forEach(function(k){keep[k]=S.hist[k];});
  return {v:1,words:S.words,folders:S.folders,langs:S.langs,hist:keep,mine:S.mine};
}
function mergeInto(d){
  if(!d||typeof d!=='object')return 0;
  var key=function(w){return wordLang(w)+'|'+String(w.en||'').toLowerCase();};
  var map={};S.words.forEach(function(w){map[key(w)]=w;});
  var added=0,max=S.words.reduce(function(m,w){return Math.max(m,w.seq||0);},0);
  (Array.isArray(d.words)?d.words:[]).forEach(function(w){
    if(!w||typeof w.en!=='string'||typeof w.ko!=='string'||!w.en.trim())return;
    var cur=map[key(w)];
    if(cur){
      if((w.seen||0)>(cur.seen||0)){['box','due','seen','wrong','first'].forEach(function(f){if(typeof w[f]==='number')cur[f]=w[f];});}
      if(!cur.ex&&w.ex)cur.ex=String(w.ex).slice(0,300);
      return;
    }
    if(S.words.length>=MAX_WORDS)return;
    var n={seq:++max,en:w.en.slice(0,80),ko:w.ko.slice(0,200),ex:String(w.ex||'').slice(0,300),fd:cleanFolderName(w.fd)||'',lg:typeof w.lg==='string'?w.lg:'en',box:+w.box||0,due:+w.due||today(),seen:+w.seen||0,wrong:+w.wrong||0,first:+w.first||0};
    S.words.push(n);map[key(n)]=n;added++;
  });
  (Array.isArray(d.folders)?d.folders:[]).forEach(function(f){if(typeof f==='string'&&f&&S.folders.indexOf(f)<0)S.folders.push(f);});
  (Array.isArray(d.langs)?d.langs:[]).forEach(function(l){if(validLang(l)&&!S.langs.some(function(x){return x.id===l.id;})&&!LANGS.some(function(x){return x.id===l.id;}))S.langs.push(l);});
  if(d.hist&&typeof d.hist==='object'){Object.keys(d.hist).forEach(function(k){
    var src=d.hist[k];if(!src||typeof src!=='object')return;
    var dst=S.hist[k]||(S.hist[k]={});
    Object.keys(src).forEach(function(f){var v=+src[f];if(isFinite(v)&&v>(dst[f]||0))dst[f]=v;});
  });}
  (Array.isArray(d.mine)?d.mine:[]).forEach(function(t){if(typeof t==='string'&&t&&S.mine.indexOf(t)<0&&S.mine.length<400)S.mine.push(t.slice(0,160));});
  S.words.forEach(function(w){if(w.fd&&S.folders.indexOf(w.fd)<0)S.folders.push(w.fd);});
  S.words.sort(function(a,b){return a.seq-b.seq;});
  S.next=S.words.reduce(function(m,w){return Math.max(m,w.seq+1);},1);S.free.built=false;
  return added;
}

/* ---------- photo → text (Gemini through the server) ---------- */
function shrinkImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var max=1800,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      var u=c.toDataURL('image/jpeg',.85);res({mime:'image/jpeg',data:u.split(',')[1]});
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(Object.assign(new Error('img'),{code:'image_rejected'}));};
    im.src=url;
  });
}
async function ocrCall(files,mode,lang){
  if(!API.token||!API.user)throw Object.assign(new Error('login'),{code:'login_required'});
  var images=[];for(var i=0;i<files.length;i++)images.push(await shrinkImage(files[i]));
  try{return await api('POST','ocr',{mode:mode,lang:lang,images:images});}
  catch(e){
    var m={unauthorized:'login_required',invalid_image:'image_rejected',invalid_json:'invalid_json',rate_limited:'rate_limited'};
    throw Object.assign(new Error('ocr'),{code:m[e.code]||'ocr_failed'});
  }
}
function setupOcr(){
  if(!API.ok||!API.ocr||S.sample)return;
  S.imgLimits={maxCount:3,mediaTypes:['image/jpeg','image/png','image/webp'],maxInputBytes:20*1024*1024};
  S.sample={json:async function(prompt,opt){var r=await ocrCall(opt.images,'words',L().name);return r.words;}};
}

    var f=fin.files&&fin.files[0];fin.value='';if(!f)return;
    try{var d=JSON.parse(await f.text());var n=mergeInto(d);dirty.add('meta');queueSave();flush();V.msg={kind:'ok',text:'백업을 합쳤어요. 새 단어 '+n+'개를 가져왔어요.'};}
    catch(e){V.msg={kind:'bad',text:'백업 파일을 읽을 수 없어요.'};}
    renderTabs();renderView();
  }});
  var box=h('section',{class:'box form'},h('p',{class:'eyebrow',text:'백업'}),
    h('p',{class:'note',text:'단어, 복습 진행, 학습 기록을 파일로 저장해 두면 주소가 바뀌어도 옮길 수 있어요.'}),
    h('div',{class:'btns'},
      window.claude?null:h('button',{class:'btn',type:'button',text:'백업 파일 내려받기',onclick:function(){downloadText('wordbox-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(snapshot()),'application/json');V.msg={kind:'ok',text:'내려받았어요.'};renderView();}}),
      h('button',{class:'btn',type:'button',text:'백업 불러오기',onclick:function(){fin.click();}}),
      window.claude?h('button',{class:'btn primary',type:'button',id:'recover-btn',text:'예전에 저장한 단어 불러오기',onclick:recoverOld}):null),
    fin,msg);
  return box;
}
async function recoverOld(){
  var V=S.bk;
  try{
    var dbm=await window.claude.use('db'),user=await window.claude.use('user');
    var uid=(dbm&&user)?await user.id():null;
    if(!uid){V.msg={kind:'bad',text:'예전에 저장한 단어를 찾을 수 없어요. 이 화면에서 로그인되어 있는지 확인해 주세요.'};renderView();return;}
    var snap=await dbm.doc('data/users/'+uid+'/vocab').collection('chunks').get();
    var data={words:[],folders:[],langs:[]};
    snap.docs.forEach(function(d){var x=d.data()||{};if(Array.isArray(x.words))data.words=data.words.concat(x.words);if(Array.isArray(x.folders))data.folders=x.folders;if(Array.isArray(x.langs))data.langs=x.langs;});
    var n=mergeInto(data);dirty.add('meta');queueSave();flush();
    V.msg={kind:n||data.words.length?'ok':'bad',text:data.words.length?('예전 단어 '+data.words.length+'개를 찾았고 '+n+'개를 새로 합쳤어요. 단어장 탭의 CSV 복사로 옮겨 두세요.'):'예전에 저장한 단어가 없어요.'};
  }catch(e){V.msg={kind:'bad',text:'예전 저장분을 불러오지 못했어요.'};}
  renderTabs();renderView();
}

  var g=$('#acct-g');if(g)mountGoogle(g);
  var gg=$('#gate-g');if(gg)mountGoogle(gg);
}

/* ---------- boot ---------- */
renderStatus();renderTabs();renderView();
initStore().then(function(){renderStatus();renderTabs();renderView();initSample();return initApi();}).then(function(){renderStatus();renderTabs();renderView();if(!S.name)askName(false);});
})();
